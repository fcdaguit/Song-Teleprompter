name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper if it is missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found in repository - generating wrapper with Gradle 8.9"
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          else
            echo "gradlew already present - using the committed wrapper"
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List build outputs
        if: always()
        run: |
          echo "--- APK outputs ---"
          find app/build/outputs -name '*.apk' -print 2>/dev/null || echo "no APKs found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chordflow-prompter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
